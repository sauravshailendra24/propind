<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropInd - Advanced Paper Trading</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: monospace; background-color: #0b0e11; color: #eaecef; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #181a20; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c2f36; flex-shrink: 0; }
        #nav-buttons button { background: #2b3139; color: #fff; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; margin-right: 10px; }
        #nav-buttons button.active { background: #f0b90b; color: #000; }
        #auth-section { display: flex; gap: 10px; align-items: center; }
        #main-content { flex: 1; display: flex; padding: 10px; gap: 10px; overflow: hidden; min-height: 0; }
        .trading-disabled { opacity: 0.4; pointer-events: none; }
        /* LEFT PANEL — flex column, chart grows to fill space */
        #left-panel { flex: 2; border: 1px solid #2c2f36; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; min-height: 0; }
        #right-panel { flex: 1; border: 1px solid #2c2f36; padding: 10px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; min-height: 0; }

        .data-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
        .ask { color: #f6465d; } .bid { color: #0ecb81; }
        table { width: 100%; font-size: 12px; border-collapse: collapse; }
        td, th { padding: 4px; border-bottom: 1px solid #2c2f36; text-align: right; }
        input, select { background: #181a20; color: #eaecef; border: 1px solid #2c2f36; padding: 8px; border-radius: 4px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        button.btn-trade { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 5px; }
        .btn-buy { background: #0ecb81; color: #000; } .btn-sell { background: #f6465d; color: #fff; }
        .btn-close { background: #f0b90b; color: #000; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }

        /* CHART — flex:1 wrapper so it grows on PC, min-height keeps mobile good */
        .chart-wrapper {
            position: relative;
            flex: 1 1 400px;
            min-height: 400px;
            border: 1px solid #2c2f36;
            border-radius: 4px;
            overflow: hidden;
        }
        #chart-container { height: 100%; width: 100%; }
        #drawing-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: block; }

        .tf-btn { padding: 4px 8px; background: #2b3139; color: #fff; border: none; cursor: pointer; border-radius: 4px; margin-right: 5px; font-size: 10px; }
        .tf-btn.active { background: #f0b90b; color: #000; }

        #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
        #auth-box { background: #181a20; padding: 30px; border-radius: 8px; width: 300px; display: flex; flex-direction: column; }
        .auth-btn { background: #f0b90b; color: #000; border: none; padding: 10px; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .toggle-text { color: #f0b90b; cursor: pointer; font-size: 12px; margin-top: 10px; text-align: center; }

        /* Mobile: stack panels vertically */
        @media (max-width: 768px) {
            #main-content { flex-direction: column; }
            #left-panel { flex: none; height: 65%; }
            #right-panel { flex: none; height: 35%; }
            .chart-wrapper { min-height: 300px; flex: 1; }
        }
    </style>
</head>
<body>
    <header>
        <div id="nav-buttons">
            <button onclick="loadView('crypto', event)" class="active">Crypto</button>
            <button onclick="loadView('forex', event)">Forex</button>
            <select id="symbol-selector" onchange="changeSymbol(this.value)" style="width: auto; margin-bottom: 0;"></select>
        </div>
        <div id="auth-section">
            <div id="account-info">Balance: $0.00 | Equity: $0.00</div>
            <button class="btn-close" id="logout-btn" style="display: none;" onclick="logout()">Logout</button>
        </div>
    </header>
    <div id="main-content">
        <div id="assessment-banner" style="padding: 0 10px 10px 10px; flex-shrink: 0;"></div>
        <div id="left-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
                <h3 id="symbol-title" style="margin: 0;">Loading...</h3>
                <div id="timeframe-selector">
                    <button class="tf-btn active" onclick="changeTimeframe('1m', event)">1m</button>
                    <button class="tf-btn" onclick="changeTimeframe('5m', event)">5m</button>
                    <button class="tf-btn" onclick="changeTimeframe('15m', event)">15m</button>
                    <button class="tf-btn" onclick="changeTimeframe('1h', event)">1h</button>
                </div>
            </div>

            <div style="display: flex; gap: 5px; margin-bottom: 5px; flex-shrink: 0;">
                <button class="tf-btn" id="draw-line" onclick="setDrawingTool('line')">Trendline</button>
                <button class="tf-btn" id="draw-rect" onclick="setDrawingTool('rect')">Rectangle</button>
                <button class="tf-btn" id="draw-clear" onclick="clearDrawings()">Clear</button>
                <button class="tf-btn active" id="draw-none" onclick="setDrawingTool('none')">Cursor</button>
            </div>

            <!-- Chart wrapper grows to fill available space on PC -->
            <div class="chart-wrapper">
                <div id="chart-container"></div>
                <svg id="drawing-overlay"></svg>
            </div>

            <div id="order-book" style="flex-shrink: 0;"></div>
            <div id="options-chain" style="flex-shrink: 0;"></div>
        </div>
        <div id="right-panel">
            <div id="order-form"></div>
            <div id="dashboard">
                <h4>Account Dashboard</h4>
                <div class="data-row"><span>Balance:</span><span id="acc-balance">$0.00</span></div>
                <div class="data-row"><span>Equity:</span><span id="acc-equity">$0.00</span></div>
                <div class="data-row"><span>Used Margin:</span><span id="acc-used-margin">$0.00</span></div>
                <div class="data-row"><span>Free Margin:</span><span id="acc-free-margin">$0.00</span></div>
                <div class="data-row"><span>Margin Level:</span><span id="acc-margin-level">0%</span></div>
                <div class="data-row"><span>Unrealized PnL:</span><span id="acc-unrealized">$0.00</span></div>
                <div class="data-row"><span>Realized PnL:</span><span id="acc-realized">$0.00</span></div>
                <div class="data-row"><span>Fees & Funding:</span><span id="acc-fees">$0.00</span></div>
            </div>
            <div id="positions-table">
                <h4>Open Positions</h4>
                <table>
                    <thead><tr><th>Symbol</th><th>Side</th><th>Size</th><th>Entry</th><th>Mark</th><th>PnL</th><th>Action</th></tr></thead>
                    <tbody id="positions-body"></tbody>
                </table>
            </div>
            <div id="analytics"></div>
        </div>
    </div>
    <script type="module" src="/static/main.js"></script>
</body>
</html>
